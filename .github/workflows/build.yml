name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openorbis/openorbis-ps4-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
