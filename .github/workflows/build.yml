name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 lld-15 libicu-dev dotnet-sdk-8.0 gcc-multilib g++-multilib libc6-dev-i386 build-essential
          sudo ln -sf /usr/bin/clang-15 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-15 /usr/bin/ld.lld
          sudo rm -rf /opt/OpenOrbis-PS4-Toolchain
          sudo git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /opt/OpenOrbis-PS4-Toolchain --depth 1 --branch v0.5.4
          # --- Fix sys/ que faltan ---
          sudo mkdir -p /opt/OpenOrbis-PS4-Toolchain/usr/include/sys
          printf '#pragma once\n#ifndef _SYS_TIME_H_\n#define _SYS_TIME_H_\nstruct timeval { long tv_sec; long tv_usec; };\nstruct timespec { long tv_sec; long tv_nsec; };\n#endif\n' | sudo tee /opt/OpenOrbis-PS4-Toolchain/include/sys/time.h
          printf '#pragma once\n#include <stdint.h>\ntypedef long ssize_t;\ntypedef unsigned long size_t;\ntypedef long off_t;\ntypedef unsigned int mode_t;\n#include <sys/time.h>\n' | sudo tee /opt/OpenOrbis-PS4-Toolchain/include/sys/types.h
          printf '#pragma once\n#include <sys/types.h>\nstruct stat { unsigned int st_mode; };\n' | sudo tee /opt/OpenOrbis-PS4-Toolchain/include/sys/stat.h
          echo '#pragma once' | sudo tee /opt/OpenOrbis-PS4-Toolchain/include/sys/cdefs.h
          sudo cp /opt/OpenOrbis-PS4-Toolchain/include/sys/time.h /opt/OpenOrbis-PS4-Toolchain/usr/include/sys/time.h
          sudo cp /opt/OpenOrbis-PS4-Toolchain/include/sys/types.h /opt/OpenOrbis-PS4-Toolchain/usr/include/sys/types.h
          sudo cp /opt/OpenOrbis-PS4-Toolchain/include/sys/stat.h /opt/OpenOrbis-PS4-Toolchain/usr/include/sys/stat.h
          sudo cp /opt/OpenOrbis-PS4-Toolchain/include/sys/cdefs.h /opt/OpenOrbis-PS4-Toolchain/usr/include/sys/cdefs.h
          # --- Fix pthread.h roto ---
          printf '#pragma once\n#include <sys/types.h>\ntypedef struct { char _d[64]; } pthread_t;\ntypedef struct { char _d[64]; } pthread_attr_t;\ntypedef struct { char _d[64]; } pthread_mutex_t;\ntypedef struct { char _d[64]; } pthread_mutexattr_t;\ntypedef struct { char _d[64]; } pthread_cond_t;\ntypedef struct { char _d[64]; } pthread_condattr_t;\ntypedef struct { char _d[64]; } pthread_rwlock_t;\ntypedef struct { char _d[64]; } pthread_rwlockattr_t;\ntypedef struct { char _d[64]; } pthread_barrier_t;\ntypedef struct { char _d[64]; } pthread_barrierattr_t;\ntypedef struct { char _d[64]; } pthread_spinlock_t;\ntypedef struct { char _d[64]; } pthread_key_t;\ntypedef struct { char _d[64]; } pthread_once_t;\ntypedef OrbisPthread OrbisPthreadT;\n' | sudo tee /tmp/fix.h
          # Inyecta los tipos antes del contenido original de pthread.h
          sudo bash -c 'cat /tmp/fix.h > /tmp/new.h; cat /opt/OpenOrbis-PS4-Toolchain/include/orbis/_types/pthread.h >> /tmp/new.h; cp /tmp/new.h /opt/OpenOrbis-PS4-Toolchain/include/orbis/_types/pthread.h'
          # Parche kernel.h para que vea time.h
          sudo sed -i '1i#include <sys/types.h>' /opt/OpenOrbis-PS4-Toolchain/include/orbis/_types/kernel.h
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis-PS4-Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis-PS4-Toolchain/bin" >> $GITHUB_PATH
      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis-PS4-Toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          mkdir -p sce_sys/about
          find $OO_PS4_TOOLCHAIN -name "*.sprx" -exec cp {} sce_sys/about/ \; 2>/dev/null || true
          make
      - uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
