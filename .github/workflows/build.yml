name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ghcr.io/openorbis/toolchain:0.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export OO_PS4_TOOLCHAIN=/opt/orbis
          make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
