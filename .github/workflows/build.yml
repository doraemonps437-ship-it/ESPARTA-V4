name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld

      - name: Build
        run: |
          make
          ls -lh

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4
          path: |
            *.pkg
            eboot.bin
            build/
