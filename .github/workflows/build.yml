name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain v0.5.4 (con libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 libicu-dev dotnet-sdk-8.0 jq
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
          sudo rm -rf /opt/OpenOrbis-PS4-Toolchain
          sudo mkdir -p /opt/OpenOrbis-PS4-Toolchain
          echo "Buscando asset Linux v0.5.4..."
          ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/v0.5.4 | jq -r '.assets[].browser_download_url' | grep -i -E "linux|ubuntu" | head -n1)
          if [ -z "$ASSET_URL" ]; then
            ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/v0.5.4 | jq -r '.assets[].browser_download_url' | grep -i tar.gz | head -n1)
          fi
          echo "Descargando $ASSET_URL"
          curl -L "$ASSET_URL" -o /tmp/toolchain.tar.gz
          sudo tar -xzf /tmp/toolchain.tar.gz -C /opt/OpenOrbis-PS4-Toolchain --strip-components=1
          ls /opt/OpenOrbis-PS4-Toolchain/lib/
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis-PS4-Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis-PS4-Toolchain/bin" >> $GITHUB_PATH
      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis-PS4-Toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          sed -i 's/sceKernelDebugOutText("/sceKernelDebugOutText(0, "/g' src/main.c || true
          mkdir -p sce_sys/about
          cp $OO_PS4_TOOLCHAIN/lib/crt1.o ./ 2>/dev/null || cp $OO_PS4_TOOLCHAIN/lib/*/crt1.o ./ 2>/dev/null || true
          make
          ls -lh *.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
