name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libicu-dev wget unzip python3
          python3 << 'PY'
          import urllib.request, json, os, sys
          api="https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/v0.5.4"
          data=json.load(urllib.request.urlopen(api))
          urls=[a["browser_download_url"] for a in data["assets"]]
          # busca ubuntu primero
          url=next((u for u in urls if "ubuntu" in u.lower() and u.endswith(".zip")), None)
          if not url:
              url=next((u for u in urls if u.endswith(".zip")), None)
          print(f"URL={url}")
          if not url:
              sys.exit(1)
          urllib.request.urlretrieve(url, "/tmp/tc.zip")
          PY
          sudo unzip -q /tmp/tc.zip -d /opt
          TC=$(find /opt -type d -name "OpenOrbis-PS4-Toolchain" | head -n1)
          echo "Found $TC"
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV
          echo "$TC/bin" >> $GITHUB_PATH

      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          mkdir -p sce_sys/about
          find $OO_PS4_TOOLCHAIN -name "*.sprx" -exec cp {} sce_sys/about/ \; 2>/dev/null || true
          make

      - uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
