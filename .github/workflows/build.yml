name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libicu-dev unzip wget
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/openorbis-ps4-toolchain-0.5.4-ubuntu-22.04.zip -O toolchain.zip
          unzip -q toolchain.zip -d /tmp/tc
          TC=$(find /tmp/tc -type d -name "OpenOrbis-PS4-Toolchain" | head -n 1)
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV
          echo "TOOLCHAIN_PATH=$TC" >> $GITHUB_ENV
      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          cp $OO_PS4_TOOLCHAIN/lib/x86_64-unknown-freebsd12.0/*.sprx sce_sys/about/ 2>/dev/null || true
          cp $OO_PS4_TOOLCHAIN/lib/*.sprx sce_sys/about/ 2>/dev/null || true
          make
      - uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
