name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain 0.5.4
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld llvm libicu-dev
          git clone --depth 1 --branch v0.5.4 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/oo
          cd /tmp/oo
          sudo make -j$(nproc) install
          ls /usr/local/orbis/bin/

      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN=/usr/local/orbis
          export PATH=/usr/local/orbis/bin:$PATH
          make

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
