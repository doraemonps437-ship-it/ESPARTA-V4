name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain v0.5.4 (con libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 lld-15 libicu-dev dotnet-sdk-8.0 jq
          sudo ln -sf /usr/bin/clang-15 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-15 /usr/bin/ld.lld
          sudo rm -rf /opt/OpenOrbis-PS4-Toolchain /opt/openorbis /opt/toolchain*
          ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/v0.5.4 | jq -r '.assets[].browser_download_url' | grep llvm-18 | head -n1)
          echo "Descargando $ASSET_URL"
          curl -L "$ASSET_URL" -o /tmp/toolchain.tar.gz
          sudo mkdir -p /opt
          sudo tar -xzf /tmp/toolchain.tar.gz -C /opt
          TOOLCHAIN_PATH=$(find /opt -name "crt1.o" | head -n1 | xargs dirname | xargs dirname)
          sudo ln -sf "$TOOLCHAIN_PATH" /opt/OpenOrbis-PS4-Toolchain
          echo "OO_PS4_TOOLCHAIN=/opt/OpenOrbis-PS4-Toolchain" >> $GITHUB_ENV
          echo "/opt/OpenOrbis-PS4-Toolchain/bin" >> $GITHUB_PATH
      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN=/opt/OpenOrbis-PS4-Toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          sed -i 's/sceKernelDebugOutText("/sceKernelDebugOutText(0, "/g' src/main.c || true
          mkdir -p sce_sys/about
          # Copia todos los sprx del toolchain y asegura right.sprx
          find $OO_PS4_TOOLCHAIN -name "*.sprx" -exec cp {} sce_sys/about/ \; 2>/dev/null || true
          touch sce_sys/about/right.sprx
          ls -lh sce_sys/about/
          make
          ls -lh *.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
