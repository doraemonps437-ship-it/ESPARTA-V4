name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/orbisdev/orbisdev:latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          export OO_PS4_TOOLCHAIN=/usr/local/orbis
          make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG-PS4
          path: |
            *.pkg
            **/*.pkg
            bin/*.pkg
