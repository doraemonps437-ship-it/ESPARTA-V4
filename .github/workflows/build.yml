name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libicu-dev wget unzip
          # prueba varios nombres, uno tiene que funcionar
          for URL in \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/openorbis-ps4-toolchain-0.5.4-ubuntu-22.04.zip" \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/openorbis-ps4-toolchain-0.5.4.zip" \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/openorbis-ps4-toolchain-0.5.3-ubuntu-22.04.zip" \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/openorbis-ps4-toolchain-0.5.3.zip"
          do
            echo "Probando $URL"
            if wget -q --show-progress "$URL" -O /tmp/tc.zip; then
              echo "BAJADO!"
              break
            fi
          done
          ls -lh /tmp/tc.zip
          sudo unzip -q /tmp/tc.zip -d /opt
          TC=$(find /opt -type d -name "*OpenOrbis*" | head -n1)
          echo "Toolchain en $TC"
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV
          echo "$TC/bin" >> $GITHUB_PATH
          ls $TC/bin | head -n20

      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          mkdir -p sce_sys/about
          find $OO_PS4_TOOLCHAIN -name "*.sprx" -exec cp {} sce_sys/about/ \; 2>/dev/null || true
          make

      - uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
