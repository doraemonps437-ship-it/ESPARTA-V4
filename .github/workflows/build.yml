name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libicu-dev
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/openorbis-ps4-toolchain-0.5.4-ubuntu-22.04.zip -O tc.zip || wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/openorbis-ps4-toolchain-0.5.4.zip -O tc.zip
          sudo unzip -q tc.zip -d /opt
          TC=$(find /opt -type d -name "OpenOrbis-PS4-Toolchain" | head -n1)
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV
          echo "$TC/bin" >> $GITHUB_PATH
      - name: Build PKG
        run: |
          export OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN
          export PATH=$OO_PS4_TOOLCHAIN/bin:$PATH
          mkdir -p sce_sys/about
          find $OO_PS4_TOOLCHAIN -name "*.sprx" -exec cp {} sce_sys/about/ \; 2>/dev/null || true
          make
      - uses: actions/upload-artifact@v4
        with:
          name: ESPARTA-V4-PKG
          path: "*.pkg"
